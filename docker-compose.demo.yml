# ==========================================================================
# Advantech YOLO Vision — Detection Demo Compose File
# ==========================================================================
# Launches the self-contained detect-demo image (sources, demo video, and
# yolo11n weights baked in) and runs YOLO11 detection on data/test.mp4
# with NVIDIA hardware acceleration on Jetson devices.
#
# Usage:
#   # First time only: allow the container to draw on the local display
#   xhost +local:root
#
#   # Launch (opens an OpenCV window on the device screen + saves to ./results):
#   docker compose -f docker-compose.demo.yml up
#
#   # One-shot run, removed on exit:
#   docker compose -f docker-compose.demo.yml run --rm detect-demo
#
#   # Tear down:
#   docker compose -f docker-compose.demo.yml down
#
# Image is produced by the Dockerfile in this repo:
#   docker build --network=host -t harbor.arfa.wise-paas.com/weda-edge/advantech-yolo-vision-applications:detect-demo .
# ==========================================================================

services:
  detect-demo:
    image: harbor.arfa.wise-paas.com/weda-edge/advantech-yolo-vision-applications:detect-demo
    runtime: nvidia
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    init: true
    working_dir: /advantech
    shm_size: '2gb'
    # unless-stopped lets `docker restart` / `compose start` re-use the
    # already-created container (skipping the create step on each launch),
    # which trims ~1-2s off iteration time. Container still exits cleanly
    # on `compose down`.
    restart: unless-stopped

    # --loop tells advantech-yolo.py to replay the video continuously
    # without reloading the model, so the demo keeps running on the
    # display until you press 'q' or run `docker compose down`.
    command: >
      python3 src/advantech-yolo.py
      --task detect
      --model yolo11n.pt
      --input data/test.mp4
      --conf 0.25
      --device 0
      --show
      --loop

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,compute,video,utility,graphics
      - CUDA_DEVICE_MAX_CONNECTIONS=1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:64
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}
      # X11 → device-local display screen (Jetson desktop session is always :0)
      - DISPLAY=:0
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - XDG_RUNTIME_DIR=/tmp
      # Point Xlib at the cookie mounted from the host (see volumes below)
      - XAUTHORITY=/tmp/.docker.xauth

    volumes:
      # Persist annotated output back to the host
      - ./results:/advantech/results:rw

      # Jetson hardware acceleration (Tegra libs / GStreamer plugins)
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0:ro

      # X11 socket + GDM-issued magic cookie for the host's local display.
      # The cookie path is fixed on JetPack 6 (GDM + uid 1000 = mic-733ao),
      # so the container picks it up without any host-side `xhost` or
      # `export XAUTHORITY=...` step before `docker compose up`.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000/gdm/Xauthority:/tmp/.docker.xauth:ro

      # Persisted caches — cuDNN autotune, TensorRT timing cache, and the
      # Ultralytics settings file. Saves ~2-4s on every cold start once the
      # first run has populated them.
      - yolo-nv-cache:/root/.nv
      - yolo-user-cache:/root/.cache
      - yolo-ultralytics-config:/advantech/.config/Ultralytics

    # Jetson GPU / multimedia device passthrough (JetPack 6 / R36 node set)
    devices:
      - /dev/nvhost-ctrl-gpu
      - /dev/nvhost-prof-gpu
      - /dev/nvhost-as-gpu
      - /dev/nvhost-gpu
      - /dev/nvmap
      - /dev/nvgpu/igpu0
      - /dev/v4l2-nvenc
      - /dev/v4l2-nvdec
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-modeset

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu, compute, utility, video]
              count: all

volumes:
  yolo-nv-cache:
  yolo-user-cache:
  yolo-ultralytics-config:
