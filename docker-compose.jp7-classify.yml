# ==============================================================================
# Advantech YOLO Vision (JetPack 7 / Jetson Thor) — Classification Demo
#
# One of three sibling demos: docker-compose.jp7.yml (detect), -segment.yml,
# -classify.yml. Each runs its OWN image, carrying only that task's weights.
# The three are built from one parameterised Dockerfile.jp7 and share every
# layer below the weights, so they cost ~12 GB in total rather than ~36 GB.
# Each file pins its own project name, container name and BYOL volume, so
# all three can run side by side without fighting over either.
#
# NOTE: classification has no --iou parameter — the app ignores it for this task.
#
# SELF-CONTAINED: this file is the whole deployment. Copy just this one file to
# the edge device and run it — there is no .env, and nothing else needs to be
# present next to it:
#
#     scp docker-compose.jp7-classify.yml <device>:~/docker-compose.yml
#     ssh <device> 'docker compose up -d'
#
# Every value below is inlined with a ${VAR:-default} default, so it runs with
# no environment set, and any single value can still be overridden ad hoc:
#
#     YOLO_CONF=0.4 docker compose up -d
#
# ------------------------------------------------------------------------------
# THE IMAGE COMES FROM HARBOR. The default ref is pushed and linux/arm64, so a
# device that can reach harbor.edgesync.cloud pulls it automatically on `up` —
# which is what makes shipping this single file sufficient. The device must be
# logged in:  docker login harbor.edgesync.cloud
#
# There is deliberately no `build:` section: building needs src/, data/ and
# models/ from the repo, which by definition are not there when you ship only
# this file. To rebuild and republish from a full checkout:
#     docker build -f Dockerfile.jp7 \
#       --build-arg YOLO_TASK=classify \
#       --build-arg YOLO_WEIGHTS=yolo11n-cls.pt \
#       -t harbor.edgesync.cloud/weda-ai/advantech-yolo-vision:jp7-classify .
#     docker push harbor.edgesync.cloud/weda-ai/advantech-yolo-vision:jp7-classify
# For an air-gapped device, stream it instead of pulling:
#     docker save <ref> | gzip -1 | ssh <device> 'gunzip -c | docker load'
#
# For the same reason there are NO source bind-mounts here. The repo-side dev
# convenience of mounting ./src, ./data, ./models and ./entrypoint.jp7.sh over
# the image is REMOVED on purpose: with only this file present Docker would
# create those paths EMPTY and mount them over the image's own copies (and turn
# entrypoint.jp7.sh into a directory), so the container would fail with no
# obvious cause. The image already contains all four. Only ./results — an
# output directory, safe to autocreate — is still bind-mounted.
#
# ------------------------------------------------------------------------------
# LICENCE GATE: Ultralytics is BYOL and is NOT in the image. The container
# cannot run inference until you accept its terms. Either flip the default on
# the line marked [EULA] below, or start with:
#     ACCEPT_ULTRALYTICS_EULA=true docker compose up -d
#
# ------------------------------------------------------------------------------
# THOR NOTES (why this differs from the JP6 wiring)
#
#  * No explicit `devices:` list. Thor exposes the GPU dGPU-style —
#    /dev/nvidia0, /dev/nvidiactl, and NO /dev/nvgpu. The JP6 node set
#    (/dev/nvhost-*, /dev/nvmap, /dev/nvgpu/igpu0) does not exist, and naming a
#    missing path under `devices:` makes the container fail to start outright.
#    /dev is bind-mounted wholesale instead, as CV_demo does.
#
#  * `deploy.resources.reservations.devices: driver: nvidia` requests a CDI
#    device, which forces the nvidia runtime down the CDI path on a device that
#    has /etc/cdi/nvidia.yaml. NVIDIA_CONTAINER_RUNTIME_MODE=csv does NOT
#    override it. See CV_demo/weda-cv-vlm/TROUBLESHOOTING.md §9.11.
#
#  * A CDI spec ships CUDA/EGL/Vulkan but ZERO GStreamer entries, so libgstnv*
#    is never injected and video decode falls back to CPU. This file ships the
#    per-container fix (§9.11 Fix B): host plugins to /opt/nvgst, their dep libs
#    to /opt/nvhostlibs. Verified a harmless no-op on a CSV-mode box such as
#    aimb294 (which has no /etc/cdi/nvidia.yaml) — keep it, it is what makes the
#    same file work on a CDI-mode Thor.
# ==============================================================================
# Pin the project name. Compose otherwise derives it from the DIRECTORY the file
# sits in, so the same file in ~/yolo and ~/deploy would be two projects fighting
# over one named BYOL volume ("volume ... was created for project X, expected Y").
# Pinning it means this file behaves identically wherever it is dropped.
name: advantech-yolo-jp7-classify

services:
  advantech-yolo:
    image: ${YOLO_JP7_IMAGE:-harbor.edgesync.cloud/weda-ai/advantech-yolo-vision:jp7-classify}
    container_name: ${CONTAINER_NAME:-advantech-yolo-jp7-classify}
    restart: "no"
    runtime: nvidia
    privileged: true
    entrypoint: ["/wise-edge/advantech-yolo/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video, display]
    network_mode: host
    ipc: host
    shm_size: '1gb'
    environment:
      # ── Display ─────────────────────────────────────────────────────────────
      # DISPLAY :0 and the GDM cookie are correct for a standard single-seat
      # Jetson desktop. Override both if the device runs a different session.
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      # ── NVIDIA ──────────────────────────────────────────────────────────────
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility,graphics,display}
      # ── Libraries (see THOR NOTES / TROUBLESHOOTING §9.11) ───────────────────
      - LD_LIBRARY_PATH=/opt/nvhostlibs:${LD_LIBRARY_PATH:-/usr/local/lib:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/tegra}
      - GST_PLUGIN_PATH=/opt/nvgst
      # ── Qt / GUI Stability ──────────────────────────────────────────────────
      - QT_X11_NO_MITSHM=${QT_X11_NO_MITSHM:-1}
      - NO_AT_SPI=${NO_AT_SPI:-1}
      - DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-/dev/null}
      # ── [EULA] Ultralytics is BYOL — see LICENCE GATE above ─────────────────
      # Change the default to `true` here to accept the terms permanently.
      - ACCEPT_ULTRALYTICS_EULA=${ACCEPT_ULTRALYTICS_EULA:-false}
      - ACCEPT_COMMERCIAL_EULA=${ACCEPT_ULTRALYTICS_EULA:-false}
      # ── BYOL Packages ───────────────────────────────────────────────────────
      # Declared here (not just exported by entrypoint.sh) so that `docker exec`
      # shells resolve the BYOL install too.
      - WEDA_CV_BYOL_DIR=/opt/weda-cv/byol
      - PYTHONPATH=/opt/weda-cv/byol
      - ULTRALYTICS_VERSION=${ULTRALYTICS_VERSION:-8.4.24}
      - ULTRALYTICS_THOP_VERSION=${ULTRALYTICS_THOP_VERSION:-2.0.18}
      # ── Application ─────────────────────────────────────────────────────────
      - YOLO_CONFIG_DIR=/wise-edge/advantech-yolo/.config/Ultralytics
      - YOLO_AUTOINSTALL=false
    volumes:
      # ── Host timezone (keeps saved-result timestamps in sync) ───────────────
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # ── X11 Display ─────────────────────────────────────────────────────────
      - ${X11_SOCKET:-/tmp/.X11-unix}:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/tmp/.Xauthority:ro
      # ── Device Access (Thor: no /dev/nvgpu — see THOR NOTES) ────────────────
      - /dev:/dev:rw
      # ── NVIDIA GStreamer plugins + dep libs (Thor CDI gap, §9.11 Fix B) ─────
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/opt/nvgst:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/opt/nvhostlibs:ro
      # ── Persistent Output (the ONLY source-tree mount — safe to autocreate) ─
      - ./results:/wise-edge/advantech-yolo/output:rw
      # ── BYOL Packages (persisted: hydrate once per device, not per launch) ──
      - byol:/opt/weda-cv/byol:rw
    working_dir: /wise-edge/advantech-yolo
    tty: true
    stdin_open: true
    # With YOLO_AUTOSTART=true the container renders the annotated stream on the
    # device's display as soon as the stack comes up — no docker exec needed.
    #
    # --loop is what makes it *stay* on screen: inference runs at GPU speed
    # (~93 fps on Thor), so a 343-frame clip plays out in under 4 seconds and the
    # window vanishes before anyone sees it. Replaying keeps it up indefinitely.
    #
    # Anything other than `true` drops to an idle shell instead — the CV_demo
    # default, and what you want when hydration failed and you need to poke at
    # the environment rather than watch a demo fail to start.
    command:
      - /bin/bash
      - -lc
      - |
        if [ "${YOLO_AUTOSTART:-true}" = "true" ]; then
          exec python3 src/advantech-yolo.py \
            --task "${YOLO_TASK:-classify}" \
            --model "${YOLO_MODEL:-models/yolo11n-cls.pt}" \
            --input "${YOLO_INPUT:-data/test.mp4}" \
            --conf "${YOLO_CONF:-0.25}" \
            --device "${YOLO_DEVICE:-0}" \
            ${YOLO_SHOW:---show} ${YOLO_LOOP:---loop} \
            --save --save-dir "/wise-edge/advantech-yolo/output/${YOLO_TASK:-classify}"
        fi
        exec /bin/bash
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-3}"

# ==============================================================================
# Named volume holding the licensed (BYOL) Ultralytics install. Kept outside the
# container lifecycle so that recreating the container does not force a network
# re-install — the root cause of the hydration timeouts on slow links.
# Purge with: docker volume rm advantech-yolo-jp7-classify-byol
# ==============================================================================
volumes:
  byol:
    name: ${BYOL_VOLUME:-advantech-yolo-jp7-classify-byol}
