# ==========================================================================
# WEDA container-management stack -- YOLO11 looping object-detection demo
# ==========================================================================
# Target device: adlk.edgedevice.2 (Jetson Orin, JetPack 6.2 / R36.4.4)
#
# Deploy as a stack revision through the WEDA container-management API.
#
# Field choices are deliberately conservative, because WEDA's compose
# passthrough is not guaranteed to accept every Docker Compose key:
#   * `runtime: nvidia` is OMITTED -- the device's Docker daemon already has
#     nvidia as its default runtime, so the GPU is injected without it, and
#     omitting it removes a field WEDA might reject.
#   * the explicit `devices:` list is OMITTED -- `privileged: true` already
#     grants the container the full /dev tree it needs.
# ==========================================================================

services:
  # ------------------------------------------------------------------------
  # MQTT broker for detection telemetry.
  #
  # `-c /mosquitto-no-auth.conf` is required: mosquitto 2.x refuses remote
  # connections under its default config, and that stock file (shipped in the
  # image) enables an anonymous listener on 1883 without needing a bind-mounted
  # config file -- which a WEDA-deployed stack cannot easily provide.
  #
  # Anonymous access is acceptable here because host networking keeps the
  # broker on the device's own interfaces for a demo. Do NOT reuse this
  # unauthenticated config for anything carrying real process data.
  # ------------------------------------------------------------------------
  mqtt-broker:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  yolo-od-demo:
    image: harbor.arfa.wise-paas.com/edge-coa/yolo-od-demo:1.6.0
    depends_on:
      - mqtt-broker

    # No explicit `container_name`: WEDA derives its own name from the stack
    # (e.g. edge_yolo-od-demo-yolo-od-demo-1, matching how the pulsar stack is
    # named on this device).  Pinning a name here would collide with anything
    # already using it and breaks WEDA's per-stack naming.
    privileged: true
    ipc: host
    network_mode: host
    restart: unless-stopped
    shm_size: '1gb'

    environment:
      # Reach the device's local screen. The X server runs on :0 under gdm.
      - DISPLAY=:0
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,compute,video,utility,graphics
      # Restore JetPack's GTK-enabled OpenCV over opencv-python-headless.
      - PYTHONPATH=/usr/lib/python3.10/dist-packages
      - YOLO_AUTOINSTALL=false
      # OD_bottle_2 needs no fine-tuning: COCO knows `bottle` and detects this
      # clip at 100% frame coverage. yolo11n measured best over all 478 frames
      # (6.06 boxes/frame @23.8 FPS vs yolo26n's 4.97 @22.4). yolo26n is also
      # baked in -- switch MODEL_PATH to /advantech/models/yolo26n.pt, no rebuild.
      - VIDEO_PATH=/advantech/data/OD_bottle_2.mp4
      - MODEL_PATH=/advantech/models/yolo11n.pt
      - CONF_THRESHOLD=0.40
      # MQTT telemetry. Host networking puts the broker on 127.0.0.1:1883.
      # Publishing on a 1s interval rather than per frame: at ~12 FPS a
      # per-frame topic is 12 msg/s of near-identical payloads for no gain.
      - MQTT_ENABLED=true
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_QOS=0
      - MQTT_INTERVAL_SEC=1.0
      - MQTT_INCLUDE_BOXES=true
      - MQTT_TOPIC_BASE=advantech/74fe488d5d54/vision
      - DEVICE_ID=74fe488d5d54
      # Windowed rather than fullscreen. An explicit size is required:
      # OpenCV sizes a normal window to the source frame (2560x1440),
      # which overflows the 1920x1080 panel.
      - FULLSCREEN=false
      - WINDOW_WIDTH=1280
      - WINDOW_HEIGHT=720
      - WINDOW_X=40
      - WINDOW_Y=40
      - STATS_INTERVAL_SEC=60

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # gdm owns the live X cookie; it is not at ~/.Xauthority on this device.
      - /run/user/1000/gdm/Xauthority:/tmp/.docker.xauth:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro

    # The device root filesystem sits at 88% capacity. Without these caps an
    # unbounded json-file log would consume the remaining space and take the
    # device down during a long-running demo.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
